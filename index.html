<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f4ef">
    <title>Gassy — Fuel spend, clearly tracked</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <main class="main-content" id="overview">
            <header class="topbar">
                <div class="brand-wrap">
                    <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
                    <span class="brand-name">gassy</span>
                </div>
                <div class="topbar-meta">
                    <span class="eyebrow">September 2026</span>
                    <button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
                        <span class="sun-icon">☼</span>
                        <span class="moon-icon">☾</span>
                    </button>
                </div>
            </header>

            <div class="content-wrap">
                <section class="hero">
                    <div>
                        <p class="eyebrow">Overview</p>
                        <h1>Good morning, Vaclav<span>.</span></h1>
                        <p class="intro-copy">Keep your fuel spending in sight.</p>
                    </div>
                    <button class="primary-button" type="button"><span>＋</span> Add entry</button>
                </section>

                <section class="summary-grid" aria-label="Monthly summary">
                    <article class="summary-card stats-card">
                        <p class="eyebrow">Spent this month</p>
                        <strong id="combined-used">0 Kč</strong>
                        <span id="combined-caption">0% of 10,000 Kč monthly limit</span>
                    </article>
                    <article class="summary-card limit-card" data-card="shell">
                        <div class="station-row">
                            <span class="station-badge badge-shell">Shell</span>
                            <span class="status-pill">Active</span>
                        </div>
                        <strong class="card-used">0</strong>
                        <div class="progress-track"><div class="progress-fill shell-fill"></div></div>
                        <div class="limit-meta">
                            <span class="card-remaining">5,000 Kč remaining</span>
                            <span class="card-percent">0%</span>
                        </div>
                    </article>
                    <article class="summary-card limit-card" data-card="orlen">
                        <div class="station-row">
                            <span class="station-badge badge-orlen">ORLEN</span>
                            <span class="status-pill">Active</span>
                        </div>
                        <strong class="card-used">0</strong>
                        <div class="progress-track"><div class="progress-fill orlen-fill"></div></div>
                        <div class="limit-meta">
                            <span class="card-remaining">5,000 Kč remaining</span>
                            <span class="card-percent">0%</span>
                        </div>
                    </article>
                </section>

                <section class="panel-grid">
                    <aside class="entries-panel" id="entries">
                        <div class="panel-heading">
                            <div>
                                <p class="eyebrow">Latest activity</p>
                                <h2>Recent entries</h2>
                            </div>
                            <button class="round-arrow" type="button" aria-label="View all entries">↗</button>
                        </div>

                        <div class="entry-list" id="entry-list"></div>
                        <button class="view-all" type="button">View all entries <span>→</span></button>
                    </aside>
                </section>
            </div>
        </main>
    </div>

    <div class="modal-backdrop" id="entry-modal" aria-hidden="true">
        <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="entry-modal-title">
            <button class="modal-close" type="button" data-close-entry-modal aria-label="Close add entry modal">×</button>
            <div class="panel-heading modal-heading">
                <div>
                    <p class="eyebrow">New record</p>
                    <h2 id="entry-modal-title">Add fuel entry</h2>
                </div>
                <span class="form-step">01 / 01</span>
            </div>

            <form id="fuel-form">
                <div class="field-group">
                    <label for="station">Gas station</label>
                    <div class="select-wrap">
                        <select id="station" name="station">
                            <option value="shell">Shell</option>
                            <option value="orlen">ORLEN</option>
                        </select>
                        <span>⌄</span>
                    </div>
                </div>

                <div class="field-row">
                    <div class="field-group">
                        <label for="date">Date</label>
                        <input id="date" name="date" type="date">
                    </div>
                    <div class="field-group">
                        <label for="liters">Liters <em>Optional</em></label>
                        <div class="input-suffix">
                            <input id="liters" name="liters" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00">
                            <span>L</span>
                        </div>
                    </div>
                </div>

                <div class="field-row">
                    <div class="field-group">
                        <label for="amount">Total amount</label>
                        <div class="input-suffix">
                            <input id="amount" name="amount" type="number" min="0" step="1" inputmode="numeric" placeholder="0" required>
                            <span>Kč</span>
                        </div>
                    </div>
                    <div class="field-group">
                        <label for="price">Price/L <em>Optional</em></label>
                        <div class="input-suffix">
                            <input id="price" name="price" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00">
                            <span>Kč/L</span>
                        </div>
                    </div>
                </div>

                <button class="submit-button" type="submit">Save fuel entry <span>→</span></button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
